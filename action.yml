name: post-range-diff-comment
description: >-
  On a force push to a pull request, post `git range-diff` of the old and new series as a collapsed comment, one collapsible section per rewritten commit. Draft pull requests are skipped until they are marked ready for review; converting one to draft posts a minimized marker at its head.
author: Fungi contributors
branding:
  icon: git-commit
  color: purple
inputs:
  token:
    description: "Token with `contents: read` and `pull-requests: write`."
    default: ${{ github.token }}
  before:
    description: "Head commit before the push; on `ready_for_review` the head of the last range-diff comment or draft marker is used instead."
    default: ${{ github.event.before }}
  after:
    description: Head commit after the push.
    default: ${{ github.event.after || github.event.pull_request.head.sha }}
  draft:
    description: "Whether the pull request is a draft; a force push to a draft posts nothing, but `converted_to_draft` posts a minimized marker."
    default: ${{ github.event.pull_request.draft }}
  event-action:
    description: "The pull request event action; `ready_for_review` posts from the last range-diff comment or draft marker, and `converted_to_draft` posts a minimized marker at the head."
    default: ${{ github.event.action }}
  base-ref:
    description: The pull request's base branch.
    default: ${{ github.event.pull_request.base.ref }}
  pr-number:
    description: The pull request to comment on.
    default: ${{ github.event.pull_request.number }}
  creation-factor:
    description: "Passed to `git range-diff --creation-factor`; empty keeps git's default."
    default: ""
  max-comment-bytes:
    description: "Interdiffs are truncated to keep the comment under this size; GitHub's limit is 65536."
    default: "65000"
  wrap-width:
    description: "Interdiff lines in the comment longer than this are hard wrapped, repeating their diff markers; at least 4, or empty to never wrap."
    default: "120"
  hide-after-days:
    description: "On a force push, hide as outdated the earlier range-diff comments that are at least this many days old; empty keeps them all."
    default: "3"
  post-comment:
    description: Set to `false` to render the comment to the log and job summary without posting it.
    default: "true"
outputs:
  forced:
    description: "`true` if there is a range-diff to post, `false` if no range-diff was posted; a `converted_to_draft` marker is still posted with `forced` false."
    value: ${{ steps.run.outputs.forced }}
  comment-url:
    description: URL of the posted comment, when one was posted.
    value: ${{ steps.run.outputs.comment-url }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        DRAFT: ${{ inputs.draft }}
        EVENT_ACTION: ${{ inputs.event-action }}
        BASE_REF: ${{ inputs.base-ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CREATION_FACTOR: ${{ inputs.creation-factor }}
        MAX_COMMENT_BYTES: ${{ inputs.max-comment-bytes }}
        POST_COMMENT: ${{ inputs.post-comment }}
        HIDE_AFTER_DAYS: ${{ inputs.hide-after-days }}
        WRAP_WIDTH: ${{ inputs.wrap-width }}
      run: bash "$GITHUB_ACTION_PATH/post-range-diff-comment.sh"
